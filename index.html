<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Учёт отправлений</title>

  <!-- PWA Manifest и метатеги для установки как приложение -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" id="theme-color-meta" content="#005bff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Учёт" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    :root {
      --primary: #005bff;
      --primary-dark: #0047cc;
      --primary-light: #eaf1ff;
      --primary-light-hover: #dbe7ff;
      --success: #059669;
      --success-light: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --warning-border: #fde68a;
      --bg: #f4f5f8;
      --card-bg: #ffffff;
      --text: #171a1f;
      --text-muted: #788292;
      --border: #e2e5eb;
      --danger: #fa383e;
      --danger-light: #feecef;
      --radius: 12px;
      --radius-sm: 7px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body.theme-wb {
      --primary: #cb11ab;
      --primary-dark: #a10986;
      --primary-light: #fdf0fa;
      --primary-light-hover: #fae1f5;
    }

    /* Стили тёмной темы */
    body.dark-mode {
      color-scheme: dark;
      --bg: #11141a;
      --card-bg: #1a1e26;
      --text: #f0f3f8;
      --text-muted: #8c96a5;
      --border: #29303d;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #16243b;
      --primary-light-hover: #1f3354;
      --success: #10b981;
      --success-light: #0d2a21;
      --success-border: #145941;
      --warning: #f59e0b;
      --warning-light: #2d210b;
      --warning-border: #664614;
      --danger: #ff4d53;
      --danger-light: #331519;
    }

    body.dark-mode.theme-wb {
      --primary: #d924b8;
      --primary-dark: #b8169a;
      --primary-light: #341530;
      --primary-light-hover: #4a1c45;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 115px;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Верхняя панель */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .header-top {
      background: var(--primary);
      color: #ffffff;
      padding: 10px 16px;
      width: 100%;
      transition: background-color 0.25s ease;
    }
    body.dark-mode .header-top {
      background: #151922;
      border-bottom: 1px solid var(--border);
    }

    .header-top-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Кнопка смены темы */
    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    body.dark-mode .theme-toggle-btn {
      background: var(--card-bg);
      border-color: var(--border);
      color: var(--text);
    }
    .theme-toggle-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Выбор маркетплейса */
    .market-menu-wrap { position: relative; }
    .market-selector-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 6px 10px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.3px;
    }
    body.dark-mode .market-selector-btn {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }
    .market-selector-btn:active { background: rgba(255, 255, 255, 0.28); }
    .market-chevron { display: flex; align-items: center; }

    .market-dropdown {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      min-width: 175px;
      overflow: hidden;
      display: none;
      z-index: 200;
      animation: menuPop 0.15s ease-out;
    }
    .market-dropdown.open { display: block; }

    @keyframes menuPop {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .market-item {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .market-item:last-child { border-bottom: none; }
    .market-item:hover { background: var(--primary-light); }
    .market-item.active { color: var(--primary); background: var(--primary-light); }
    .market-dot { width: 9px; height: 9px; border-radius: 50%; }
    .market-dot.ozon { background: #005bff; }
    .market-dot.wb { background: #cb11ab; }

    .stat-item { text-align: right; }
    .stat-label {
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.82);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    body.dark-mode .stat-label {
      color: var(--text-muted);
    }
    .stat-value {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }
    body.dark-mode .stat-value {
      color: var(--text);
    }

    /* Календарь */
    .date-section {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .date-top-row {
      max-width: 680px;
      margin: 0 auto;
      padding: 6px 14px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-trigger {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: var(--radius-sm);
    }
    .month-trigger:active { background: var(--bg); }
    .month-icon { display: flex; align-items: center; color: var(--primary); }
    .hidden-date-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
    }

    .date-actions { display: flex; align-items: center; gap: 5px; }
    .btn-today {
      border: none;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
    }
    .btn-today:active { transform: scale(0.95); }
    .month-nav-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
    }
    .month-nav-btn:active { background: var(--primary-light); }

    /* Карточки дней */
    .days-ribbon-container { max-width: 680px; margin: 0 auto; }
    .days-ribbon {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 5px 12px 8px;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
    }
    .days-ribbon::-webkit-scrollbar { display: none; }

    .day-card {
      flex: 0 0 38px;
      height: 50px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: center;
      position: relative;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .day-card:active { transform: scale(0.95); }
    .day-card .day-weekday {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      line-height: 1;
    }
    .day-card .day-number {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-top: 2px;
    }
    .day-card .day-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: transparent;
      margin-top: 2px;
    }
    .day-card .day-dot.dot-complete { background: var(--success); }
    .day-card .day-dot.dot-pending { background: #f59e0b; }

    .day-card.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }
    .day-card.active .day-weekday { color: rgba(255, 255, 255, 0.9); }
    .day-card.active .day-number { color: #ffffff; }
    .day-card.active .day-dot.dot-complete { background: #6ee7b7; }
    .day-card.active .day-dot.dot-pending { background: #fde68a; }

    .day-card.is-today:not(.active) { border-color: var(--primary); background: var(--primary-light); }
    .day-card.is-today:not(.active) .day-number { color: var(--primary); }

    /* Контейнер */
    .container {
      max-width: 680px;
      margin: 10px auto;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      touch-action: pan-y;
    }

    /* Аккордеоны смен */
    .shift-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      transition: border-color 0.2s;
    }
    .shift-card:not(.open) { overflow: hidden; }
    .shift-card.open { overflow: visible; }

    .shift-header {
      padding: 9px 12px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-radius: 11px;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }
    .shift-header:active { background: var(--primary-light); }
    .shift-card.open .shift-header {
      border-bottom-color: var(--border);
      background: var(--card-bg);
      border-radius: 11px 11px 0 0;
    }

    .shift-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .shift-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .shift-name { font-size: 14px; font-weight: 800; color: var(--text); }
    .shift-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 7px;
      border-radius: 10px;
    }
    .shift-arrow {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: transform 0.25s ease;
    }
    .shift-card.open .shift-arrow {
      transform: rotate(180deg);
    }

    .shift-body {
      display: none;
      padding: 8px 8px 10px;
      flex-direction: column;
      gap: 4px;
    }
    .shift-card.open .shift-body {
      display: flex;
    }

    /* СЕТКИ ШАПОК И СТРОК (Колонка количества расширена до 72px) */
    .shift-table-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1.15fr) 28px;
      gap: 6px;
      align-items: center;
      padding: 2px 7px;
      border: 1px solid transparent;
      user-select: none;
    }

    .ozon-table-header {
      display: grid;
      grid-template-columns: 48px 72px minmax(0, 1fr) 28px;
      gap: 6px;
      align-items: center;
      padding: 2px 7px;
      border: 1px solid transparent;
      user-select: none;
    }

    .shift-table-header .col-lbl,
    .ozon-table-header .col-lbl {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shift-table-header .col-name {
      text-align: left;
      padding-left: 7px;
    }
    .ozon-table-header .col-num {
      text-align: center;
    }

    .shift-table-header .col-qty,
    .ozon-table-header .col-qty {
      text-align: center;
    }

    .shift-table-header .col-scan,
    .ozon-table-header .col-scan {
      text-align: center;
    }

    .shift-table-header .col-del,
    .ozon-table-header .col-del {
      width: 28px;
    }

    /* Список строк */
    .shift-rows-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* Строка точки */
    .store-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 7px;
      min-height: 38px;
      transition: border-color .15s, background-color .15s;
    }

    /* Строка точки WB */
    body.theme-wb .store-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1.15fr) 28px;
      gap: 6px;
      align-items: center;
    }

    /* Строка точки Ozon */
    body.theme-ozon .store-row {
      display: grid;
      grid-template-columns: 48px 72px minmax(0, 1fr) 28px;
      gap: 6px;
      align-items: center;
    }

    .store-row.is-scanned {
      border-color: var(--success-border);
      background: var(--success-light);
    }
    .store-row.is-no-scan {
      border-color: var(--warning-border);
      background: var(--warning-light);
    }

    /* Поле названия точки / номера */
    .store-number-wrap {
      width: 100%;
      min-width: 0;
    }

    .store-number-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      outline: none;
      background: var(--card-bg);
      transition: border-color .15s, box-shadow .15s;
    }

    body.theme-wb .store-number-input {
      text-align: left;
      padding-left: 7px;
    }

    .store-number-input:not(.is-readonly):focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .store-number-input.is-readonly {
      background: var(--bg);
      border-color: transparent;
      color: var(--text-muted);
      cursor: default;
      pointer-events: none;
      font-size: 12.5px;
    }

    .qty-wrap {
      width: 100%;
      position: relative;
    }

    /* Исправленный инпут количества: отступ справа 24px исключает наезд на шт. */
    .qty-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 24px 4px 4px;
      font-size: 13.5px;
      font-weight: 800;
      text-align: right;
      color: var(--text);
      outline: none;
      background: var(--card-bg);
    }
    .qty-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    .qty-unit {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9.5px;
      line-height: 1;
      color: var(--text-muted);
      font-weight: 700;
      pointer-events: none;
    }

    /* Кнопка статуса */
    .btn-scan {
      width: 100%;
      height: 32px;
      min-height: 32px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all .12s ease;
    }
    .btn-scan:active { transform: scale(0.97); }
    .btn-scan.scanned {
      background: var(--success-light);
      border-color: var(--success);
      color: var(--success);
    }
    .btn-scan.no-scan {
      background: var(--warning-light);
      border-color: var(--warning);
      color: var(--warning);
    }

    .del-btn {
      width: 28px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .del-btn:hover { background: var(--danger-light); color: var(--danger); }
    .del-btn:active { transform: scale(0.92); }

    .btn-add-row-shift {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 7px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 7px;
      cursor: pointer;
      text-align: center;
      margin-top: 3px;
    }
    .btn-add-row-shift:active { background: var(--primary-light); }

    /* Пустой день */
    .empty-day-box {
      text-align: center;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      padding: 24px 16px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .empty-day-title { font-size: 13.5px; color: var(--text-muted); }
    .btn-action-light {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Нижняя панель */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 8px 14px 12px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    .bottom-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .bottom-left-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bottom-summary-text {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .bottom-actions-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-sub-action {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-sub-action:active {
      transform: scale(0.96);
      background: var(--primary-light);
    }

    .btn-sub-action.reset-action {
      background: var(--danger-light);
      border-color: rgba(250, 56, 62, 0.3);
      color: var(--danger);
    }
    .btn-sub-action.reset-action:active {
      background: var(--danger);
      color: #fff;
    }

    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    .btn-add:active {
      background: var(--primary-dark);
      transform: scale(0.98);
    }

    /* Модалки */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: 300;
      display: none;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }

    .modal-sheet {
      background: var(--card-bg);
      color: var(--text);
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 18px 18px 0 0;
      padding: 16px 14px 24px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border-top: 1px solid var(--border);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-size: 15px;
      font-weight: 800;
    }

    .modal-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 8px;
      cursor: pointer;
    }
    .history-row:hover { background: var(--primary-light); }

    .reset-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .reset-card:active { transform: scale(0.98); }

    .reset-card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .reset-card-text { flex: 1; }
    .reset-card-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 2px;
    }
    .reset-card-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .reset-card.card-day {
      border-color: var(--border);
      background: var(--card-bg);
    }
    .reset-card.card-day .reset-card-icon {
      background: var(--bg);
      color: var(--text);
    }

    .reset-card.card-all {
      border-color: rgba(250, 56, 62, 0.3);
      background: var(--danger-light);
    }
    .reset-card.card-all .reset-card-icon {
      background: rgba(250, 56, 62, 0.2);
      color: var(--danger);
    }
    .reset-card.card-all .reset-card-title { color: var(--danger); }

    .btn-sheet-cancel {
      width: 100%;
      background: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-sheet-cancel:active { background: var(--border); }

    /* Окно подтверждения удаления */
    .confirm-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .confirm-modal-overlay.active { display: flex; }

    .confirm-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      padding: 20px 18px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: popConfirm 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .confirm-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary);
    }

    @keyframes popConfirm {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .confirm-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .confirm-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 5px;
    }

    .confirm-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.35;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
    }

    .confirm-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .confirm-btn-cancel {
      background: var(--bg);
      color: var(--text);
    }
    .confirm-btn-cancel:active { background: var(--border); }

    .confirm-btn-action {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }
    .confirm-btn-action:active {
      background: var(--primary-dark);
      transform: scale(0.98);
    }
  </style>
</head>
<body class="theme-ozon">

  <header class="header">
    <div class="header-top">
      <div class="header-top-content">
        <div class="market-menu-wrap">
          <button class="market-selector-btn" onclick="toggleMarketDropdown(event)">
            <span id="market-title">Учёт Ozon</span>
            <span class="market-chevron">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </button>
          <div class="market-dropdown" id="market-dropdown">
            <div class="market-item" id="opt-ozon" onclick="selectMarket('ozon')">
              <span class="market-dot ozon"></span>
              <span>Ozon</span>
            </div>
            <div class="market-item" id="opt-wb" onclick="selectMarket('wb')">
              <span class="market-dot wb"></span>
              <span>Wildberries</span>
            </div>
          </div>
        </div>

        <div class="header-right-group">
          <!-- Кнопка смены темы -->
          <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleThemeMode()" title="Сменить тему">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <div class="stat-item">
            <div class="stat-label">За день</div>
            <div class="stat-value" id="day-total-qty">0 шт.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Календарь -->
    <div class="date-section">
      <div class="date-top-row">
        <div class="month-trigger">
          <span id="month-title">Сентябрь 2026</span>
          <span class="month-icon">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
          <input type="date" class="hidden-date-input" id="date-picker-input" onchange="onDatePicked(this.value)">
        </div>

        <div class="date-actions">
          <button class="month-nav-btn" title="Предыдущий месяц" onclick="shiftMonth(-1)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="btn-today" onclick="goToToday()">Сегодня</button>
          <button class="month-nav-btn" title="Следующий месяц" onclick="shiftMonth(1)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <div class="days-ribbon-container">
        <div class="days-ribbon" id="days-ribbon"></div>
      </div>
    </div>
  </header>

  <main class="container" id="main-content"></main>

  <aside class="bottom-bar">
    <div class="bottom-content">
      <div class="bottom-left-block">
        <div class="bottom-summary-text">
          Итого: <strong id="summary-stores-count" style="color:var(--text)">0 точ.</strong>
          <span id="summary-scanned-count" style="color: var(--success); font-weight:700; margin-left: 2px;"></span>
        </div>
        <div class="bottom-actions-row">
          <button class="btn-sub-action" onclick="toggleHistory(true)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
            <span>История</span>
          </button>
          <button class="btn-sub-action reset-action" onclick="toggleResetModal(true)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><polyline points="8 16 3 16 3 21"/></svg>
            <span>Сброс</span>

        </div>
      </div>
      <button class="btn-add" id="btn-add-store" onclick="handleAddStoreClick()">+ Добавить Ozon</button>
    </div>
  </aside>

  <!-- Окно подтверждения удаления -->
  <div class="confirm-modal-overlay" id="confirm-modal" onclick="if(event.target === this) handleConfirmResult(false)">
    <div class="confirm-card">
      <div class="confirm-icon-wrap" id="confirm-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </div>
      <div class="confirm-title" id="confirm-title">Удалить точку?</div>

      <div class="confirm-actions">
        <button type="button" class="confirm-btn confirm-btn-cancel" onclick="handleConfirmResult(false)">Отмена</button>
        <button type="button" class="confirm-btn confirm-btn-action" id="confirm-action-btn" onclick="handleConfirmResult(true)">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Шторка сброса данных -->
  <div class="modal-overlay" id="reset-modal" onclick="if(event.target === this) toggleResetModal(false)">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Управление сбросом</h3>
        <button style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--text-muted);" onclick="toggleResetModal(false)">×</button>
      </div>

      <div style="display:flex; flex-direction:column; gap:7px;">
        <div class="reset-card card-day" onclick="resetDayOnly()">
          <div class="reset-card-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><polyline points="8 16 3 16 3 21"/></svg>
          </div>
          <div class="reset-card-text">
            <div class="reset-card-title">Обнулить текущий день</div>
            <div class="reset-card-desc">Сбросит штуки и отметки сканирования. Точки останутся.</div>
          </div>
        </div>

        <div class="reset-card card-all" onclick="resetEntireDatabase()">
          <div class="reset-card-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </div>
          <div class="reset-card-text">
            <div class="reset-card-title">Очистить всю базу</div>
            <div class="reset-card-desc">Удалит все сохранённые дни и точки сервиса.</div>
          </div>
        </div>

        <button class="btn-sheet-cancel" onclick="toggleResetModal(false)">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модалка истории -->
  <div class="modal-overlay" id="history-modal" onclick="if(event.target === this) toggleHistory(false)">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Сводка по дням</h3>
        <button style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--text-muted);" onclick="toggleHistory(false)">×</button>
      </div>
      <div class="modal-list" id="history-items"></div>
    </div>
  </div>

  <script>
    let currentMarket = localStorage.getItem('selected_market') || 'ozon';
    let currentDate = getTodayDateStr();
    let confirmCallback = null;

    const ICONS = {
      sun: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
      moon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
      chevronDown: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
      check: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      cross: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`
    };

    const WB_DEFAULT_STORES = ['Ярославль', 'Москва', 'Екатеринбург', 'Санкт-Петербург', 'Краснодар'];

    const MARKET_CONFIG = {
      ozon: {
        title: 'Учёт Ozon',
        addBtn: '+ Добавить Ozon',
        storageKey: 'ozon_daily_inventory_db',
        bodyClass: 'theme-ozon',
        themeColor: '#005bff'
      },
      wb: {
        title: 'Учёт Wildberries',
        addBtn: '+ Добавить точку',
        storageKey: 'wb_daily_inventory_shifts_db',
        bodyClass: 'theme-wb',
        themeColor: '#cb11ab'
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      applyThemeMode();
      applyMarketTheme();
      renderRibbon();
      renderCurrentDay();
      initSwipeNavigation();

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.market-menu-wrap')) {
          document.getElementById('market-dropdown').classList.remove('open');
        }
      });
    });

    /* Управление светлой/тёмной темой */
    function toggleThemeMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
      updateThemeToggleIcon(isDark);
      updateStatusBarColor();
    }

    function applyThemeMode() {
      const savedTheme = localStorage.getItem('app_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme ? (savedTheme === 'dark') : prefersDark;
      document.body.classList.toggle('dark-mode', isDark);
      updateThemeToggleIcon(isDark);
      updateStatusBarColor();
    }

    function updateThemeToggleIcon(isDark) {
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isDark ? ICONS.sun : ICONS.moon;
        btn.title = isDark ? 'Включить светлую тему' : 'Включить тёмную тему';
      }
    }

    function updateStatusBarColor() {
      const themeColorMeta = document.getElementById('theme-color-meta');
      if (themeColorMeta) {
        const isDark = document.body.classList.contains('dark-mode');
        const cfg = MARKET_CONFIG[currentMarket];
        themeColorMeta.setAttribute('content', isDark ? '#151922' : cfg.themeColor);
      }
    }

    function initSwipeNavigation() {
      let touchStartX = 0;
      let touchStartY = 0;
      const targetArea = document.getElementById('main-content');

      targetArea.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].clientX;
        touchStartY = e.changedTouches[0].clientY;
      }, { passive: true });

      targetArea.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > 55 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          if (diffX < 0) {
            shiftDay(1);
          } else {
            shiftDay(-1);
          }
        }
      }, { passive: true });
    }

    function shiftDay(delta) {
      const [y, m, d] = currentDate.split('-').map(Number);
      const newDate = new Date(y, m - 1, d + delta);
      currentDate = formatDateToYMD(newDate);
      renderRibbon(true);
      renderCurrentDay();
    }

    function showConfirmModal({ title, desc, confirmText = 'Удалить', onConfirm }) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-desc').textContent = desc;
      document.getElementById('confirm-action-btn').textContent = confirmText;
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.add('active');
    }

    function handleConfirmResult(agreed) {
      document.getElementById('confirm-modal').classList.remove('active');
      if (agreed && typeof confirmCallback === 'function') {
        confirmCallback();
      }
      confirmCallback = null;
    }

    function toggleMarketDropdown(e) {
      e.stopPropagation();
      document.getElementById('market-dropdown').classList.toggle('open');
    }

    function selectMarket(marketKey) {
      if (currentMarket === marketKey) {
        document.getElementById('market-dropdown').classList.remove('open');
        return;
      }

      currentMarket = marketKey;
      localStorage.setItem('selected_market', marketKey);
      document.getElementById('market-dropdown').classList.remove('open');

      applyMarketTheme();
      renderRibbon(false);
      renderCurrentDay();
    }

    function applyMarketTheme() {
      const cfg = MARKET_CONFIG[currentMarket];
      document.body.classList.remove('theme-ozon', 'theme-wb');
      document.body.classList.add(cfg.bodyClass);

      document.getElementById('market-title').textContent = cfg.title;
      document.getElementById('btn-add-store').textContent = cfg.addBtn;

      updateStatusBarColor();

      document.getElementById('opt-ozon').classList.toggle('active', currentMarket === 'ozon');
      document.getElementById('opt-wb').classList.toggle('active', currentMarket === 'wb');
    }

    function getStorageKey() {
      return MARKET_CONFIG[currentMarket].storageKey;
    }

    function getTodayDateStr() {
      return formatDateToYMD(new Date());
    }

    function formatDateToYMD(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getDayDotStatus(dateStr, db) {
      const dayData = db[dateStr];
      if (!dayData) return null;

      let items = [];
      if (currentMarket === 'wb') {
        const morning = dayData.morning || dayData.day || [];
        const evening = dayData.evening || [];
        items = [...morning, ...evening];
      } else {
        items = Array.isArray(dayData) ? dayData : [];
      }

      if (items.length === 0) return null;

      const itemsWithQty = items.filter(i => (parseInt(i.qty, 10) || 0) > 0);
      if (itemsWithQty.length === 0) {
        const anyScanned = items.some(i => i.scanned === 'scanned' || i.scanned === 'no_scan');
        return anyScanned ? 'complete' : null;
      }

      const allProcessed = itemsWithQty.every(i => i.scanned === 'scanned' || i.scanned === 'no_scan');
      return allProcessed ? 'complete' : 'pending';
    }

    function renderRibbon(shouldCenter = true) {
      const [y, m, d] = currentDate.split('-').map(Number);
      const activeDateObj = new Date(y, m - 1, d);
      const todayStr = getTodayDateStr();
      const db = getAllData();

      const monthName = activeDateObj.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
      document.getElementById('month-title').textContent = capitalize(monthName);
      document.getElementById('date-picker-input').value = currentDate;

      const ribbon = document.getElementById('days-ribbon');
      ribbon.innerHTML = '';

      const daysInMonth = new Date(y, m, 0).getDate();
      let activeCard = null;

      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const loopDate = new Date(y, m - 1, dayNum);
        const loopDateStr = formatDateToYMD(loopDate);
        const weekday = loopDate.toLocaleDateString('ru-RU', { weekday: 'short' });

        const card = document.createElement('div');
        card.className = 'day-card';

        const isSelected = (loopDateStr === currentDate);
        const isToday = (loopDateStr === todayStr);
        const dotStatus = getDayDotStatus(loopDateStr, db);

        if (isSelected) {
          card.classList.add('active');
          activeCard = card;
        }
        if (isToday) card.classList.add('is-today');

        let dotClass = 'day-dot';
        if (dotStatus === 'complete') dotClass += ' dot-complete';
        else if (dotStatus === 'pending') dotClass += ' dot-pending';

        card.innerHTML = `
          <span class="day-weekday">${weekday}</span>
          <span class="day-number">${dayNum}</span>
          <span class="${dotClass}"></span>
        `;

        card.onclick = () => {
          if (currentDate === loopDateStr) return;
          currentDate = loopDateStr;
          renderRibbon(true);
          renderCurrentDay();
        };

        ribbon.appendChild(card);
      }

      if (shouldCenter && activeCard) {
        setTimeout(() => {
          activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 50);
      }
    }

    function shiftMonth(delta) {
      const [y, m, d] = currentDate.split('-').map(Number);
      const newDate = new Date(y, m - 1 + delta, 1);
      currentDate = formatDateToYMD(newDate);
      renderRibbon(true);
      renderCurrentDay();
    }

    function onDatePicked(val) {
      if (!val) return;
      currentDate = val;
      renderRibbon(true);
      renderCurrentDay();
    }

    function goToToday() {
      currentDate = getTodayDateStr();
      renderRibbon(true);
      renderCurrentDay();
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function getAllData() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveAllData(db) {
      localStorage.setItem(getStorageKey(), JSON.stringify(db));
    }

    function renderCurrentDay() {
      const container = document.getElementById('main-content');
      container.innerHTML = '';
      const db = getAllData();
      const dayData = db[currentDate];

      if (currentMarket === 'wb') {
        renderWbContent(container, dayData);
      } else {
        renderOzonContent(container, dayData);
      }
      recalculateAll();
    }

    function renderWbContent(container, dayData) {
      const morningData = (dayData && (dayData.morning || dayData.day)) || WB_DEFAULT_STORES.map(name => ({ storeNumber: name, qty: '', scanned: '' }));
      const eveningData = (dayData && dayData.evening) || WB_DEFAULT_STORES.map(name => ({ storeNumber: name, qty: '', scanned: '' }));

      const currentHour = new Date().getHours();
      
      // Утро: с 06:00 до 14:59
      const isMorningActive = (currentHour >= 6 && currentHour < 15);
      // Вечер: с 15:00 до 05:59 утра
      const isEveningActive = (currentHour >= 15 || currentHour < 6);

      container.appendChild(createShiftAccordion('morning', ICONS.sun, 'Утро', morningData, isMorningActive));
      container.appendChild(createShiftAccordion('evening', ICONS.moon, 'Вечер', eveningData, isEveningActive));
    }

    function createShiftAccordion(shiftKey, iconSvg, title, items, isOpenByDefault = false) {
      const card = document.createElement('div');
      card.className = `shift-card ${isOpenByDefault ? 'open' : ''}`;
      card.dataset.shift = shiftKey;

      card.innerHTML = `
        <div class="shift-header" onclick="toggleShift(this)">
          <div class="shift-title-group">
            <span class="shift-icon">${iconSvg}</span>
            <span class="shift-name">${title}</span>
            <span class="shift-badge shift-badge-${shiftKey}">0 шт.</span>
          </div>
          <span class="shift-arrow">${ICONS.chevronDown}</span>
        </div>
        <div class="shift-body">
          <div class="shift-table-header">
            <span class="col-lbl col-name">Название</span>
            <span class="col-lbl col-qty">Количество</span>
            <span class="col-lbl col-scan">Сканирование</span>
            <span class="col-lbl col-del"></span>
          </div>
          <div class="shift-rows-list" id="shift-list-${shiftKey}"></div>
          <button type="button" class="btn-add-row-shift" onclick="addShiftRow('${shiftKey}')">+ Добавить точку в смену</button>
        </div>
      `;

      const list = card.querySelector(`#shift-list-${shiftKey}`);
      items.forEach(item => {
        list.appendChild(createStoreRow(item.storeNumber, item.qty, item.scanned, shiftKey));
      });

      return card;
    }

    function toggleShift(headerEl) {
      const card = headerEl.closest('.shift-card');
      card.classList.toggle('open');
    }

    /* Рендер Ozon с табличной шапкой */
    function renderOzonContent(container, dayStores) {
      if (!dayStores || dayStores.length === 0) {
        container.innerHTML = `
          <div class="empty-day-box">
            <div class="empty-day-title">На этот день записей Ozon нет</div>
            <button class="btn-action-light" onclick="addOzonRow()">Создать первую точку</button>
          </div>
        `;
        return;
      }

      const header = document.createElement('div');
      header.className = 'ozon-table-header';
      header.innerHTML = `
        <span class="col-lbl col-num">Номер</span>
        <span class="col-lbl col-qty">Количество</span>
        <span class="col-lbl col-scan">Сканирование</span>
        <span class="col-lbl col-del"></span>
      `;
      container.appendChild(header);

      const listWrap = document.createElement('div');
      listWrap.id = 'ozon-list-wrap';
      listWrap.className = 'shift-rows-list';

      dayStores.forEach((s, idx) => {
        listWrap.appendChild(createStoreRow(`№${idx + 1}`, s.qty, s.scanned, null));
      });
      container.appendChild(listWrap);
    }

    function normalizeStatus(scanned) {
      if (scanned === true || scanned === 'scanned') return 'scanned';
      if (scanned === 'no_scan') return 'no_scan';
      return '';
    }

    /* Унифицированная строка точки для WB и Ozon */
    function createStoreRow(storeNumber = '', qty = '', scanned = '', shiftKey = null) {
      const row = document.createElement('div');
      const status = normalizeStatus(scanned);
      const isWB = (currentMarket === 'wb');

      let rowClass = 'store-row';
      if (status === 'scanned') rowClass += ' is-scanned';
      else if (status === 'no_scan') rowClass += ' is-no-scan';

      row.className = rowClass;
      row.dataset.status = status;
      if (shiftKey) row.dataset.shift = shiftKey;

      let btnContentHtml = '';
      let btnClass = 'btn-scan';

      if (status === 'scanned') {
        btnClass += ' scanned';
        btnContentHtml = `${ICONS.check} <span>Отсканировано</span>`;
      } else if (status === 'no_scan') {
        btnClass += ' no-scan';
        btnContentHtml = `${ICONS.cross} <span>Не требуется</span>`;
      } else {
        btnContentHtml = `<span>Не сканировано</span>`;
      }

      row.innerHTML = `
        <div class="store-number-wrap">
          <input 
            type="text" 
            class="store-number-input ${isWB ? '' : 'is-readonly'}" 
            value="${escapeHtml(storeNumber)}" 
            title="${escapeHtml(storeNumber)}"
            placeholder="${isWB ? 'Название' : '№'}"
            ${isWB ? '' : 'readonly tabindex="-1"'}
            oninput="saveCurrentDay()"
            onkeydown="handleStoreInputKey(event, this)">
        </div>
        <div class="qty-wrap">
          <input 
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            class="qty-input" 
            value="${qty === '' ? '' : Math.max(0, parseInt(qty, 10) || 0)}" 
            placeholder="0" 
            onfocus="this.select()"
            oninput="handleQtyInput(this)"
            onkeydown="handleQtyKey(event, this)">
          <span class="qty-unit">шт.</span>
        </div>
        <button 
          type="button" 
          class="${btnClass}" 
          onclick="cycleStatus(this)">
          ${btnContentHtml}
        </button>
        <button type="button" class="del-btn" title="Удалить" onclick="confirmRemoveRow(this)">${ICONS.trash}</button>
      `;

      return row;
    }

    function handleQtyInput(input) {
      input.value = input.value.replace(/\D/g, '');
      saveCurrentDay();
    }

    function handleStoreInputKey(e, input) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const row = input.closest('.store-row');
        const qtyField = row.querySelector('.qty-input');
        if (qtyField) {
          qtyField.focus();
          qtyField.select();
        }
      }
    }

    function handleQtyKey(e, input) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const allQtyInputs = Array.from(document.querySelectorAll('.qty-input'));
        const index = allQtyInputs.indexOf(input);
        if (index !== -1 && index < allQtyInputs.length - 1) {
          allQtyInputs[index + 1].focus();
          allQtyInputs[index + 1].select();
        } else {
          handleAddStoreClick();
        }
      }
    }

    /* Единое циклическое переключение статуса сканирования */
    function cycleStatus(btn) {
      const row = btn.closest('.store-row');
      const current = row.dataset.status || '';

      let next = '';
      if (current === '') next = 'scanned';
      else if (current === 'scanned') next = 'no_scan';
      else if (current === 'no_scan') next = '';

      row.dataset.status = next;
      row.classList.remove('is-scanned', 'is-no-scan');
      btn.className = 'btn-scan';

      if (next === 'scanned') {
        row.classList.add('is-scanned');
        btn.classList.add('scanned');
        btn.innerHTML = `${ICONS.check} <span>Отсканировано</span>`;
      } else if (next === 'no_scan') {
        row.classList.add('is-no-scan');
        btn.classList.add('no-scan');
        btn.innerHTML = `${ICONS.cross} <span>Не требуется</span>`;
      } else {
        btn.innerHTML = `<span>Не сканировано</span>`;
      }

      saveCurrentDay();
    }

    function addShiftRow(shiftKey) {
      const list = document.getElementById(`shift-list-${shiftKey}`);
      const count = list.querySelectorAll('.store-row').length;
      const nextName = WB_DEFAULT_STORES[count] || `Точка ${count + 1}`;
      const newRow = createStoreRow(nextName, '', '', shiftKey);
      list.appendChild(newRow);

      const nameInput = newRow.querySelector('.store-number-input');
      nameInput.focus();
      nameInput.select();
      saveCurrentDay();
    }

    function addOzonRow() {
      const container = document.getElementById('main-content');
      let listWrap = document.getElementById('ozon-list-wrap');
      if (!listWrap) {
        container.innerHTML = '';

        const header = document.createElement('div');
        header.className = 'ozon-table-header';
        header.innerHTML = `
          <span class="col-lbl col-num">Номер</span>
          <span class="col-lbl col-qty">Количество</span>
          <span class="col-lbl col-scan">Сканирование</span>
          <span class="col-lbl col-del"></span>
        `;
        container.appendChild(header);

        listWrap = document.createElement('div');
        listWrap.id = 'ozon-list-wrap';
        listWrap.className = 'shift-rows-list';
        container.appendChild(listWrap);
      }

      const nextNum = listWrap.querySelectorAll('.store-row').length + 1;
      const newRow = createStoreRow(`№${nextNum}`, '', '', null);
      listWrap.appendChild(newRow);
      newRow.querySelector('.qty-input').focus();
      saveCurrentDay();
    }

    function handleAddStoreClick() {
      if (currentMarket === 'wb') {
        const openCard = document.querySelector('.shift-card.open') || document.querySelector('.shift-card');
        if (openCard) {
          openCard.classList.add('open');
          addShiftRow(openCard.dataset.shift);
        }
      } else {
        addOzonRow();
      }
    }

    function confirmRemoveRow(btn) {
      const row = btn.closest('.store-row');
      const input = row.querySelector('.store-number-input');
      const name = input ? input.value.trim() : 'точку';
      const qty = row.querySelector('.qty-input').value;
      const qtyText = (qty && qty !== '0') ? ` (${qty} шт.)` : '';

      showConfirmModal({
        title: 'Удалить точку?',
        desc: `Вы действительно хотите удалить «${name}»${qtyText}? Данные строки будут стёрты.`,
        confirmText: 'Удалить',
        onConfirm: () => {
          row.remove();
          if (currentMarket === 'ozon') {
            renumberOzonRows();
            const listWrap = document.getElementById('ozon-list-wrap');
            if (listWrap && listWrap.children.length === 0) {
              renderCurrentDay();
            }
          }
          saveCurrentDay();
        }
      });
    }

    function renumberOzonRows() {
      const listWrap = document.getElementById('ozon-list-wrap');
      if (!listWrap) return;
      listWrap.querySelectorAll('.store-row').forEach((row, idx) => {
        const input = row.querySelector('.store-number-input');
        if (input) input.value = `№${idx + 1}`;
      });
    }

    function saveCurrentDay() {
      const db = getAllData();

      if (currentMarket === 'wb') {
        const morningRows = document.querySelectorAll('#shift-list-morning .store-row');
        const eveningRows = document.querySelectorAll('#shift-list-evening .store-row');

        const mapRows = (rows) => Array.from(rows).map(r => ({
          storeNumber: r.querySelector('.store-number-input').value.trim(),
          qty: r.querySelector('.qty-input').value,
          scanned: r.dataset.status || ''
        }));

        db[currentDate] = {
          morning: mapRows(morningRows),
          evening: mapRows(eveningRows)
        };
      } else {
        const rows = document.querySelectorAll('#ozon-list-wrap .store-row');
        if (rows.length === 0) {
          delete db[currentDate];
        } else {
          db[currentDate] = Array.from(rows).map(r => ({
            storeNumber: r.querySelector('.store-number-input').value.trim(),
            qty: r.querySelector('.qty-input').value,
            scanned: r.dataset.status || ''
          }));
        }
      }

      saveAllData(db);
      recalculateAll();
      renderRibbon(false);
    }

    function recalculateAll() {
      let totalQty = 0;
      let totalStores = 0;
      let totalScanned = 0;

      if (currentMarket === 'wb') {
        const calcShift = (shiftKey) => {
          let shiftQty = 0;
          let shiftScanned = 0;
          const rows = document.querySelectorAll(`#shift-list-${shiftKey} .store-row`);
          rows.forEach(r => {
            const raw = r.querySelector('.qty-input').value;
            const val = raw === '' ? 0 : Math.max(0, parseInt(raw, 10) || 0);
            shiftQty += val;
            if (r.dataset.status === 'scanned') shiftScanned++;
          });

          const badge = document.querySelector(`.shift-badge-${shiftKey}`);
          if (badge) badge.textContent = `${shiftQty} шт. (${shiftScanned}/${rows.length})`;

          totalQty += shiftQty;
          totalStores += rows.length;
          totalScanned += shiftScanned;
        };

        calcShift('morning');
        calcShift('evening');
      } else {
        const rows = document.querySelectorAll('#ozon-list-wrap .store-row');
        rows.forEach(r => {
          const raw = r.querySelector('.qty-input').value;
          const val = raw === '' ? 0 : Math.max(0, parseInt(raw, 10) || 0);
          totalQty += val;
          if (r.dataset.status === 'scanned') totalScanned++;
        });
        totalStores = rows.length;
      }

      document.getElementById('day-total-qty').textContent = `${totalQty} шт.`;
      document.getElementById('summary-stores-count').textContent = `${totalStores} точ.`;

      const scannedLabel = document.getElementById('summary-scanned-count');
      if (totalScanned > 0) {
        scannedLabel.textContent = `(${totalScanned} отскан.)`;
      } else {
        scannedLabel.textContent = '';
      }
    }

    function toggleResetModal(show) {
      const modal = document.getElementById('reset-modal');
      modal.classList.toggle('active', show);
    }

    function resetDayOnly() {
      const db = getAllData();

      if (currentMarket === 'wb') {
        const morningRows = document.querySelectorAll('#shift-list-morning .store-row');
        const eveningRows = document.querySelectorAll('#shift-list-evening .store-row');

        const mapReset = (rows, defaultList) => {
          if (rows.length === 0) return defaultList.map(name => ({ storeNumber: name, qty: '', scanned: '' }));
          return Array.from(rows).map(r => ({
            storeNumber: r.querySelector('.store-number-input').value.trim(),
            qty: '',
            scanned: ''
          }));
        };

        db[currentDate] = {
          morning: mapReset(morningRows, WB_DEFAULT_STORES),
          evening: mapReset(eveningRows, WB_DEFAULT_STORES)
        };
      } else {
        const ozonRows = document.querySelectorAll('#ozon-list-wrap .store-row');
        if (ozonRows.length > 0) {
          db[currentDate] = Array.from(ozonRows).map((r, idx) => ({
            storeNumber: `№${idx + 1}`,
            qty: '',
            scanned: ''
          }));
        } else {
          delete db[currentDate];
        }
      }

      saveAllData(db);
      renderCurrentDay();
      toggleResetModal(false);
    }

    function resetEntireDatabase() {
      toggleResetModal(false);
      const marketName = (currentMarket === 'wb') ? 'Wildberries' : 'Ozon';

      showConfirmModal({
        title: 'Очистить всю базу?',
        desc: `Все сохранённые дни, точки и история отправлений для ${marketName} будут удалены без возможности восстановления.`,
        confirmText: 'Очистить всё',
        onConfirm: () => {
          localStorage.removeItem(getStorageKey());
          renderRibbon(false);
          renderCurrentDay();
        }
      });
    }

    function toggleHistory(show) {
      const modal = document.getElementById('history-modal');
      modal.classList.toggle('active', show);

      if (show) {
        const db = getAllData();
        const list = document.getElementById('history-items');
        list.innerHTML = '';

        const dates = Object.keys(db).sort().reverse();
        if (dates.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:24px;">Нет сохранённых дней</div>';
          return;
        }

        dates.forEach(d => {
          let sumQty = 0;
          let count = 0;
          let scanned = 0;

          if (currentMarket === 'wb') {
            const morningItems = db[d].morning || db[d].day || [];
            const eveItems = db[d].evening || [];
            const allItems = [...morningItems, ...eveItems];
            sumQty = allItems.reduce((acc, cur) => acc + (parseInt(cur.qty, 10) || 0), 0);
            count = allItems.length;
            scanned = allItems.filter(i => i.scanned === 'scanned').length;
          } else {
            const items = db[d] || [];
            sumQty = items.reduce((acc, cur) => acc + (parseInt(cur.qty, 10) || 0), 0);
            count = items.length;
            scanned = items.filter(i => i.scanned === 'scanned').length;
          }

          const dateTitle = new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });

          const row = document.createElement('div');
          row.className = 'history-row';
          row.innerHTML = `
            <div>
              <div style="font-weight:800;font-size:13.5px;">${dateTitle}</div>
              <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">Точек: ${count} (отскан. ${scanned})</div>
            </div>
            <div style="font-weight:800;font-size:14px;color:var(--primary);">${sumQty} шт. ›</div>
          `;
          row.onclick = () => {
            currentDate = d;
            renderRibbon(true);
            renderCurrentDay();
            toggleHistory(false);
          };
          list.appendChild(row);
        });
      }
    }

    function escapeHtml(text) {
      return (text || '').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
